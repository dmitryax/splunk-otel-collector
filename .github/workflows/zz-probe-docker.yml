name: zz-probe-docker

on:
  push:
    branches: [parity-os-matrix]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        MODE: [ "vz-native", "vz-rosetta" ]
    runs-on: macos-15
    steps:
      - name: Report arch
        run: uname -sm

      - name: Install colima
        run: brew install colima docker

      - name: Start colima (native arm64)
        if: matrix.MODE == 'vz-native'
        timeout-minutes: 15
        run: colima start --cpu 3 --memory 10 --vm-type=vz

      - name: Start colima (x86_64 under Rosetta)
        if: matrix.MODE == 'vz-rosetta'
        timeout-minutes: 15
        run: colima start --cpu 3 --memory 10 --arch x86_64 --vm-type=vz --vz-rosetta

      - name: Docker works at all?
        run: |
          docker version
          docker info --format '{{.OSType}}/{{.Architecture}}'
          docker run --rm hello-world

      - name: Can we pull the Splunk image?
        timeout-minutes: 15
        run: docker pull --platform linux/amd64 splunk/splunk:9.4.4

      - name: Does Splunk actually boot?
        timeout-minutes: 25
        run: |
          docker run -d --name splunk --platform linux/amd64 \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_PASSWORD=helloworld \
            -p 8088:8088 -p 8089:8089 splunk/splunk:9.4.4
          start=$(date +%s)
          until docker logs splunk 2>&1 | grep -q "Ansible playbook complete"; do
            if [ $(( $(date +%s) - start )) -gt 1200 ]; then
              echo "TIMEOUT after 20m"; docker logs --tail 50 splunk; exit 1
            fi
            sleep 15
          done
          echo "Splunk booted in $(( $(date +%s) - start ))s"
